name: CI - Testes Automatizados

on:
  push:
    branches:
      - master
      - feature/gestao-informacoes
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes
        run: mvn -B -f gestao-informacoes-institucionais/pom.xml clean verify